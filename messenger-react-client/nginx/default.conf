listen {
    # Host and port to listen requests at
    listen 8443 ssl
    # What client host does this server process request from
    server_name localhost;
    # SSL setup
    ssl_certificate     /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend static files (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 
        try_files $uri $uri/ /index.html; 
    }

    # Proxy API requests to host-based Spring Boot over HTTPS
    location /messenger/api/v1/ {
        proxy_pass https://host.docker.internal:8443;
        # Needed if Spring Boot uses a self-signed cert
        proxy_ssl_verify off;
        # TODO: don't forget to set headers like X_DEVICE_ID
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy WebSocket requests
    location /messenger/api/v1/ws {
        proxy_pass https://host.docker.internal:8443;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts so idle WebSocket connections survive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}