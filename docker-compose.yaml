services:
  minio:
    # pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    image: pgsty/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - C:\Users\Danver\Projects\Messenger\minio\data:/data # place your directory
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # Setting up bucket public after main container starts
  bucket-init:
    image: pgsty/mc
    container_name: minio-bucket-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO to be ready...'
        sleep 2;
      done;
      mc mb myminio/${APP_S3_STORAGE_BUCKET_NAME} --ignore-existing;
      mc anonymous set download myminio/${APP_S3_STORAGE_BUCKET_NAME};
      echo 'Bucket ${APP_S3_STORAGE_BUCKET_NAME} is ready and public.';
      "
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--aof-use-rdb-preamble", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: ./messenger-react-client
      args:
        VITE_API_URL: /messenger/api/v1
        VITE_WS_API_URL: /messenger/api/v1/ws
      dockerfile: Dockerfile
    container_name: nginx-frontend
    restart: unless-stopped
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  redis-data: