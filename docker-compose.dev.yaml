# This file extends basic one. You should run it with `docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d`
# docker-compose.dev.yaml
services:
  nginx:
    image: nginx:alpine
    container_name: nginx-frontend
    restart: unless-stopped
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./messenger-react-client/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./messenger-react-client/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - vite-dev

  vite-dev:
    build:
      context: ./messenger-react-client
      dockerfile: Dockerfile.dev
    container_name: vite-dev
    restart: unless-stopped
    volumes:
      - ./messenger-react-client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development